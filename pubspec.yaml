name: huella
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.69.0 # ✅ Agrega esta línea
  pdf: ^3.11.1
  printing: ^5.13.3
  shared_preferences: ^2.2.2

  # Firebase & Core
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  firebase_app_check: ^0.3.1
  firebase_messaging: ^15.1.3

  # UI & Maps
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1

  # Utilities
  http: ^1.2.2
  excel: ^4.0.6
  path_provider: ^2.1.4
  share_plus: ^10.0.0
  flutter_webrtc: ^0.12.0

  # Notificaciones y Audio
  flutter_local_notifications: ^17.2.2
  audioplayers: ^6.8.1
  flutter_background_service: ^5.0.5

  # Seguridad y Almacenamiento
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.2

  # ✅ Selección de Archivos e Imágenes (VERSIONES ESTABLES CORREGIDAS)
  image_picker: ^1.1.2
  file_picker: ^8.1.2          # ✅ Versión estable correcta
  url_launcher: ^6.3.0

  # ✅ Visores de PDF
  flutter_inappwebview: ^6.1.5
  syncfusion_flutter_pdfviewer: ^28.1.33
  permission_handler: ^11.3.1
  vibration: ^2.1.0
  flutter_stripe: ^14.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo_huella.png
    - assets/sounds/

# ✅ Overrides mínimos y seguros (sin win32 para evitar conflicto con file_picker)
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.24
  js: ^0.6.7
