name: huella
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Firebase & Core
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3

  # UI & Maps
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1

  # Utilities
  http: ^1.2.2
  excel: ^4.0.6
  path_provider: ^2.1.4
  share_plus: ^10.0.0
  flutter_webrtc: ^0.12.0

  # Notificaciones y Audio
  flutter_local_notifications: ^17.2.2
  audioplayers: ^6.1.0

  # Seguridad y Almacenamiento
  firebase_app_check: ^0.3.1
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.2

  # Selección de Archivos e Imágenes
  image_picker: ^1.1.2
  file_picker: 8.1.2  # ✅ Versión exacta sin bugs de win32

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo_huella.png
    - assets/sounds/

# ✅ SOLUCIÓN FINAL: Versión moderna (sin v1 embedding) pero que NO exige compileSdk 36
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.24